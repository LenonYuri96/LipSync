<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lip Sync · Personagem 2D</title>
    <!-- Bootstrap 5 + Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Folha de Estilos do Personagem -->
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <main class="card-lipsync">

        <!-- CABEÇALHO -->
        <header class="card-header-custom d-flex justify-content-between align-items-center">
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-secondary border-0 text-white fw-bold">
                    <i class="bi bi-robot me-1"></i> Nome:
                </span>
                <input type="text" id="input-nome-robo" class="form-control fw-bold border-0" value="Max"
                    placeholder="Nome do Personagem">
            </div>
        </header>

        <div class="p-3 p-md-4">

            <!-- PALCO 2D DO PERSONAGEM -->
            <section class="palco-personagem" id="palco-personagem" aria-label="Visualizador do Personagem 2D">
                <img src="img/personagem/corpo.png" id="camada-corpo" alt="Corpo do Robô">
                <img src="img/personagem/olhos_abertos.png" id="camada-olhos" alt="Olhos">
                <div id="container-boca">
                    <img src="img/personagem/bocas/boca_fechada.png" id="boca-a" class="camada-boca ativa"
                        alt="Boca Camada A">
                    <img src="img/personagem/bocas/boca_fechada.png" id="boca-b" class="camada-boca"
                        alt="Boca Camada B">
                </div>
            </section>

            <!-- PAINEL DE INTENSIDADE E CAPTAÇÃO DE VOZ -->
            <section class="painel-audio">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <small class="fw-semibold text-secondary">
                        <i class="bi bi-soundwave"></i> Intensidade da Fala:
                    </small>
                    <span id="detector-tag" class="badge bg-secondary">Silêncio</span>
                </div>
                <div class="medidor-container">
                    <div id="volume-bar" class="medidor-barra"></div>
                    <div id="threshold-marker" class="marcador-threshold" style="left: 21%;"></div>
                </div>

                <!-- Controle de Sensibilidade -->
                <div class="mt-3">
                    <div class="d-flex justify-content-between mb-1">
                        <label for="slider-sensibilidade" class="form-label small fw-bold mb-0">
                            <i class="bi bi-sliders"></i> Sensibilidade (Ponto de Corte):
                        </label>
                        <span id="sensibilidade-valor" class="badge bg-primary">6</span>
                    </div>
                    <input type="range" class="form-range" id="slider-sensibilidade" min="1" max="25" value="6"
                        step="1">
                </div>
            </section>

            <!-- BALÃO DE TEXTO TRANSCRIÇÃO -->
            <div class="balao-transcricao">
                <div id="badge-transcricao" class="badge-transcricao">
                    🎙️ <span id="texto-span"></span>
                </div>
            </div>

            <!-- BOTÕES PRINCIPAIS DE CONTROLE -->
            <div class="d-grid gap-2 mt-2">
                <button id="btn-ativar" class="btn btn-primary fw-semibold py-2">
                    <i class="bi bi-power"></i> Conectar Microfone
                </button>
                <button id="btn-toggle-sleep" class="btn btn-outline-warning btn-sm" style="display: none;">
                    <i class="bi bi-moon"></i> Fazer Robô Dormir
                </button>
            </div>

            <!-- STATUS DINÂMICO -->
            <div id="status-alert" class="alert alert-info mt-2 mb-0 py-2 text-center small" role="alert">
                <i class="bi bi-info-circle"></i> Clique em <b>"Conectar Microfone"</b> para iniciar.
            </div>

            <!-- GUIA DE COMANDOS DE VOZ -->
            <div class="row g-2 mt-2">
                <div class="col-6">
                    <div class="card-comando">
                        <small>Comando Ativar</small>
                        <strong class="text-success" id="cmd-ativar-texto">"Olá Max"</strong>
                    </div>
                </div>
                <div class="col-6">
                    <div class="card-comando">
                        <small>Comando Encerrar</small>
                        <strong class="text-danger" id="cmd-encerrar-texto">"Adeus Max"</strong>
                    </div>
                </div>
            </div>

            <!-- PAINEL RETRÁTIL DE CALIBRAÇÃO (COM AS SUAS MEDIDAS PADRÃO) -->
            <div class="accordion mt-3" id="accordionCalibrador">
                <div class="accordion-item border-0 bg-light">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed py-2 px-3 small text-secondary bg-light" type="button"
                            data-bs-toggle="collapse" data-bs-target="#collapseCalibrar">
                            <i class="bi bi-sliders2 me-2"></i> Ajustes de Posicionamento e Modo
                        </button>
                    </h2>
                    <div id="collapseCalibrar" class="accordion-collapse collapse"
                        data-bs-parent="#accordionCalibrador">
                        <div class="accordion-body p-3 border rounded mt-1 bg-white small">

                            <!-- Alternador de Modo (desmarcado para manter o seu ajuste ativo) -->
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" id="check-modo-100">
                                <label class="form-check-label fw-bold" for="check-modo-100">
                                    Modo 100% Sobreposto
                                </label>
                            </div>
                            <small class="text-muted d-block mb-3">
                                Mantenha desmarcado para usar as suas medidas personalizadas abaixo:
                            </small>

                            <!-- Sliders Oficiais Calibrados -->
                            <label class="form-label d-flex justify-content-between mb-0">
                                <span>Altura Olhos (Top):</span>
                                <b id="val-olhos-top">25.5%</b>
                            </label>
                            <input type="range" class="form-range" id="calib-olhos-top" min="10" max="65" value="25.5"
                                step="0.5">

                            <label class="form-label d-flex justify-content-between mb-0 mt-2">
                                <span>Tamanho Olhos (Largura):</span>
                                <b id="val-olhos-w">65%</b>
                            </label>
                            <input type="range" class="form-range" id="calib-olhos-w" min="10" max="85" value="65"
                                step="0.5">

                            <hr class="my-2">

                            <label class="form-label d-flex justify-content-between mb-0">
                                <span>Altura Boca (Top):</span>
                                <b id="val-boca-top">31%</b>
                            </label>
                            <input type="range" class="form-range" id="calib-boca-top" min="10" max="65" value="31"
                                step="0.5">

                            <label class="form-label d-flex justify-content-between mb-0 mt-2">
                                <span>Tamanho Boca (Largura):</span>
                                <b id="val-boca-w">65%</b>
                            </label>
                            <input type="range" class="form-range" id="calib-boca-w" min="10" max="85" value="65"
                                step="0.5">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Scripts da Aplicação -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/visemas.js"></script>
    <script src="js/lip-sync-engine.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
