<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lip Sync · Personagem 2D</title>
    <!-- Bootstrap 5 + Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/estilo.css">
    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='0' y='14'>🎤</text></svg>">
</head>

<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h1 class="h3 mb-0">
                            <i class="bi bi-mic"></i> Lip Sync · Personagem 2D
                        </h1>
                        <p class="small mb-0 opacity-75">A boca se move conforme os fonemas do português</p>
                    </div>

                    <div class="card-body p-4">
                        <!-- Área do personagem -->
                        <div class="personagem-container mx-auto" id="personagem-container">
                            <img src="img/personagem/corpo.png" id="corpo" class="img-fluid" alt="Corpo do personagem">
                            <img src="img/personagem/olhos_abertos.png" id="olhos" class="olhos"
                                alt="Olhos do personagem">
                            <img src="img/personagem/bocas/boca_fechada.png" id="boca" class="boca" alt="Boca">
                        </div>

                        <!-- Área do texto reconhecido -->
                        <div class="mt-3 text-center" id="texto-reconhecido-container" style="min-height: 60px;">
                            <div id="texto-reconhecido" class="badge bg-dark text-white p-3 fs-5"
                                style="opacity: 0; transition: opacity 0.3s;">
                                🎤 <span id="texto-span"></span>
                            </div>
                        </div>

                        <!-- Controles -->
                        <div class="d-flex flex-wrap gap-2 mt-4">
                            <button id="btn-ativar" class="btn btn-primary flex-grow-1">
                                <i class="bi bi-mic"></i> Microfone ativo
                            </button>
                            <button id="btn-desativar" class="btn btn-outline-secondary flex-grow-1" disabled>
                                <i class="bi bi-mic-mute"></i> Desativar
                            </button>
                        </div>

                        <!-- Status -->
                        <div id="status-alert" class="alert alert-info mt-3 mb-0 py-2" role="alert">
                            <i class="bi bi-info-circle"></i> Clique em "Microfone ativo" para começar.
                        </div>
                    </div>
                </div>

                <p class="text-center text-muted small mt-3">
                    Projeto desenvolvido com Bootstrap e Web Speech API.
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/visemas.js"></script>
    <script src="js/lip-sync-engine.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
